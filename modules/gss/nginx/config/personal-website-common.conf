root /personal-website;
etag on;

# Back-compat + canonical shortcuts
location = /cv-legacy { return 301 $cv_prefix/print-cv; }
location = /print-cv  { return 302 $cv_prefix/print-cv; }
location = /cv-modern { return 302 $cv_prefix/cv-modern; }

# Domain root -> person root
location = / {
    try_files $cv_prefix/index.html =404;
}

# Keep hidden area mapped to /hidden
location = /hidden {
    try_files /hidden/index.html =404;
}
location ^~ /hidden/ {
    try_files $uri $uri/ /hidden$uri /hidden$uri/ /hidden$uri/index.html /hidden/index.html =404;
}

# Hashed Astro assets: long cache
location ^~ /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Unhashed public styles: always revalidate
location ^~ /styles/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
}

# HTML: always revalidate
location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
}

# Main routing: serve real files first, then map to /ruben or /hanseo
location / {
    try_files $uri $uri/ $cv_prefix$uri $cv_prefix$uri/ $cv_prefix$uri/index.html $cv_prefix/index.html =404;
}
